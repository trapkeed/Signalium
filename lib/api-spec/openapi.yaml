components:
  responses:
    ResearchLabUnavailable:
      description: signalium-trainer's Research Lab API is not configured or unreachable. Never fabricate data for this case — render an explicit "unavailable" state.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
  schemas:
    ResearchLabPassthrough:
      description: Opaque payload proxied verbatim from signalium-trainer's Research Lab API. Signalium does not interpret or validate its internal shape — the trainer is the sole authority on this data.
      type: object
      additionalProperties: true

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Plan:
      type: object
      required: [id, name, priceMonthly, features, isActive, tier, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: ["integer", "null"]
        maxSymbols:
          type: ["integer", "null"]
        autonomousAllowed:
          type: boolean
        apiAccessAllowed:
          type: boolean
        researchAccess:
          type: boolean
        promoPriceMonthly:
          type: ["number", "null"]
        promoLabel:
          type: ["string", "null"]
        regionalPricing:
          type: object
          additionalProperties:
            type: number
          nullable: true
        createdAt:
          type: string

    PlanInput:
      type: object
      required: [name, priceMonthly, tier]
      properties:
        name:
          type: string
        description:
          type: string
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: integer
        maxSymbols:
          type: integer
        autonomousAllowed:
          type: boolean
        apiAccessAllowed:
          type: boolean
        researchAccess:
          type: boolean
        isActive:
          type: boolean
        promoPriceMonthly:
          type: ["number", "null"]
        promoLabel:
          type: ["string", "null"]
        regionalPricing:
          type: object
          additionalProperties:
            type: number

    PlanUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: integer
        maxSymbols:
          type: integer
        autonomousAllowed:
          type: boolean
        apiAccessAllowed:
          type: boolean
        researchAccess:
          type: boolean
        isActive:
          type: boolean
        promoPriceMonthly:
          type: ["number", "null"]
        promoLabel:
          type: ["string", "null"]
        regionalPricing:
          type: object
          additionalProperties:
            type: number

    Subscription:
      type: object
      required: [id, userId, planId, status, startedAt, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        planId:
          type: integer
        plan:
          $ref: "#/components/schemas/Plan"
        status:
          type: string
          enum: [pending_payment, active, grace_period, suspended, expired, cancelled, paused]
        startedAt:
          type: string
        currentPeriodEnd:
