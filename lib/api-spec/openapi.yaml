      required: [id, invoiceNumber, userId, amount, currency, status, reason, issuedAt, createdAt]
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        userId:
          type: string
        subscriptionId:
          type: ["integer", "null"]
        paymentId:
          type: ["integer", "null"]
        planId:
          type: ["integer", "null"]
        currency:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [draft, issued, paid, void]
        reason:
          type: string
          enum: [subscription_created, subscription_renewed, subscription_upgraded, subscription_downgraded]
        provider:
          type: ["string", "null"]
        paymentReference:
          type: ["string", "null"]
        issuedAt:
          type: string
        paidAt:
          type: ["string", "null"]
        createdAt:
          type: string

    InvoiceItem:
      type: object
      required: [id, invoiceId, description, quantity, unitAmount, amount]
      properties:
        id:
          type: integer
        invoiceId:
          type: integer
        description:
          type: string
        quantity:
          type: integer
        unitAmount:
          type: number
        amount:
          type: number

    InvoiceDetail:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceItem"

    SmtpSettings:
      type: object
      required: [id, host, port, username, fromEmail, fromName, useTls, isActive, createdAt]
      properties:
        id:
          type: integer
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        fromEmail:
          type: string
        fromName:
          type: string
        useTls:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    SmtpSettingsInput:
      type: object
      required: [host, username, password, fromEmail]
      properties:
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        fromEmail:
          type: string
        fromName:
          type: string
        useTls:
          type: boolean
        isActive:
          type: boolean

    SmtpSettingsUpdate:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        fromEmail:
          type: string
        fromName:
          type: string
        useTls:
          type: boolean
        isActive:
          type: boolean

    ApiKeyStatus:
      type: string
      enum: [active, revoked, expired, suspended]

    ApiKey:
      type: object
      required: [id, userId, name, keyPrefix, status, createdAt]
      properties:
        id:
          type: integer
