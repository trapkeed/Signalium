openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Signalium API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: plans
    description: Subscription plan operations
  - name: subscriptions
    description: Customer subscription operations
  - name: eas
    description: Expert Advisor operations
  - name: runtime
    description: Runtime and telemetry operations
  - name: users
    description: User management operations
  - name: stats
    description: Platform statistics operations
  - name: payments
    description: Payment and provider operations
  - name: smtp
    description: SMTP configuration operations
  - name: api-keys
    description: API key management operations
  - name: ea-registrations
    description: EA terminal registration operations
  - name: ea-builds
    description: Per-user EA build generation, download, and audit operations
  - name: symbols
    description: Universal symbol normalization, canonical registry, and alias management
  - name: qde
    description: EA <-> Platform <-> Trainer (QDE) telemetry and action loop, plus observability
  - name: account
    description: Account security — login history, active sessions, suspicious-login detection, account lock
  - name: storage
    description: Object storage upload and serving endpoints.
  - name: seo
    description: Per-page SEO metadata, redirects, robots.txt/sitemap.xml site settings.
  - name: media
    description: Media library asset management, backed by object storage.
  - name: notifications
    description: Per-user notification center feed.
  - name: announcements
    description: Admin-authored announcements, fanned out to users' notification centers and optionally shown as banners.
  - name: maintenance-banner
    description: Site-wide maintenance banner scheduling and display.
  - name: trading
    description: User trading mode selection, symbol monitoring preferences, and risk management settings.
  - name: research-lab
    description: Admin-only gateway to signalium-trainer's Research Lab (experiments, training, validation, shadow testing, deployment candidates, research intelligence, QDE genealogy). Signalium proxies reads/actions; it never re-implements trainer business logic.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List subscription plans
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create a subscription plan (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /plans/{id}:
    get:
      operationId: getPlan
      tags: [plans]
      summary: Get a plan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "404":
          description: Not found
    patch:
      operationId: updatePlan
      tags: [plans]
      summary: Update a plan (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdate"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: deletePlan
      tags: [plans]
      summary: Delete a plan (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List subscriptions
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/me:
    get:
      operationId: getMySubscription
      tags: [subscriptions]
      summary: Get the current user's subscription
      responses:
        "200":
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: No active subscription

  /subscriptions/me/entitlements:
    get:
      operationId: getMyEntitlements
      tags: [subscriptions]
      summary: Get the current user's resolved entitlements (capabilities/limits)
      responses:
        "200":
          description: Entitlement summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementSummary"

  /subscriptions/{id}/events:
    get:
      operationId: listSubscriptionEvents
      tags: [subscriptions]
      summary: List lifecycle events for a subscription (owner or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of subscription events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionEvent"
        "403":
          description: Not authorized to view these events
        "404":
          description: Subscription not found

  /subscriptions/{id}:
    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    delete:
      operationId: cancelSubscription
      tags: [subscriptions]
      summary: Cancel a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}/suspend:
    post:
      operationId: suspendSubscription
      tags: [subscriptions]
      summary: Suspend a subscription (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suspended subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}/reactivate:
    post:
      operationId: reactivateSubscription
      tags: [subscriptions]
      summary: Reactivate a suspended subscription (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reactivated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}/extend:
    post:
      operationId: extendSubscription
      tags: [subscriptions]
      summary: Extend a subscription's current period (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendSubscriptionBody"
      responses:
        "200":
          description: Extended subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}/credit:
    post:
      operationId: grantSubscriptionCredit
      tags: [subscriptions]
      summary: Grant promotional free days to a subscription (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantCreditBody"
      responses:
        "200":
          description: Credited subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /eas:
    get:
      operationId: listEas
      tags: [eas]
      summary: List Expert Advisors
      responses:
        "200":
          description: List of EAs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ea"
    post:
      operationId: createEa
      tags: [eas]
      summary: Create an EA (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaInput"
      responses:
        "201":
          description: Created EA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ea"

  /eas/{id}:
    get:
      operationId: getEa
      tags: [eas]
      summary: Get an EA by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: EA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ea"
        "404":
          description: Not found
    patch:
      operationId: updateEa
      tags: [eas]
      summary: Update an EA (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaUpdate"
      responses:
        "200":
          description: Updated EA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ea"
    delete:
      operationId: deleteEa
      tags: [eas]
      summary: Delete an EA (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /eas/{id}/download-token:
    post:
      operationId: getEaDownloadToken
      tags: [eas]
      summary: Generate a download token for an EA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Download token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadToken"

  /runtime/status:
    get:
      operationId: getRuntimeStatus
      tags: [runtime]
      summary: Get runtime status for current user
      responses:
        "200":
          description: Runtime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeStatus"

  /runtime/telemetry:
    get:
      operationId: listTelemetry
      tags: [runtime]
      summary: List recent telemetry events
      responses:
        "200":
          description: Telemetry events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelemetryEvent"
    post:
      operationId: recordTelemetry
      tags: [runtime]
      summary: Record a telemetry event (from EA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryEvent"

  /runtime/heartbeat:
    post:
      operationId: recordHeartbeat
      tags: [runtime]
      summary: Record EA heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatInput"
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/me:
    get:
      operationId: getMyUser
      tags: [users]
      summary: Get the current user's own profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMyUser
      tags: [users]
      summary: Update the current user's own profile (self-service fields only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /payments/providers:
    get:
      operationId: listPaymentProviders
      tags: [payments]
      summary: List active payment providers (safe fields only, no config/secrets — any authenticated user)
      responses:
        "200":
          description: List of payment providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentProviderPublic"
    post:
      operationId: createPaymentProvider
      tags: [payments]
      summary: Create a payment provider (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProviderInput"
      responses:
        "201":
          description: Created provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentProvider"

  /payments/providers/admin:
    get:
      operationId: listPaymentProvidersAdmin
      tags: [payments]
      summary: List all payment providers with full config (admin)
      responses:
        "200":
          description: List of payment providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentProvider"

  /payments/providers/{id}:
    get:
      operationId: getPaymentProvider
      tags: [payments]
      summary: Get a payment provider with full config (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentProvider"
    patch:
      operationId: updatePaymentProvider
      tags: [payments]
      summary: Update a payment provider (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProviderUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentProvider"
    delete:
      operationId: deletePaymentProvider
      tags: [payments]
      summary: Delete a payment provider (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /payments:
    get:
      operationId: listMyPayments
      tags: [payments]
      summary: List current user's payments
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /payments/all:
    get:
      operationId: listAllPayments
      tags: [payments]
      summary: List all payments (admin)
      responses:
        "200":
          description: All payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /payments/intent:
    post:
      operationId: createPaymentIntent
      tags: [payments]
      summary: Create a payment intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentInput"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResult"

  /payments/{id}/submit:
    post:
      operationId: submitPaymentProof
      tags: [payments]
      summary: Submit transaction hash / proof
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProofInput"
      responses:
        "200":
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}/confirmations:
    post:
      operationId: reportPaymentConfirmations
      tags: [payments]
      summary: Record on-chain confirmation progress for a USDT payment (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentConfirmationsInput"
      responses:
        "200":
          description: Payment updated (auto-confirmed if threshold reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}/confirm:
    post:
      operationId: confirmPayment
      tags: [payments]
      summary: Confirm payment and activate subscription (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}/reject:
    post:
      operationId: rejectPayment
      tags: [payments]
      summary: Reject a payment (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        "200":
          description: Payment rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}/refund:
    post:
      operationId: refundPayment
      tags: [payments]
      summary: Refund a confirmed payment (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundPaymentBody"
      responses:
        "200":
          description: Payment refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "409":
          description: Payment is not in a refundable state

  /invoices:
    get:
      operationId: listMyInvoices
      tags: [payments]
      summary: List current user's invoices
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /invoices/all:
    get:
      operationId: listAllInvoices
      tags: [payments]
      summary: List all invoices (admin)
      responses:
        "200":
          description: All invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [payments]
      summary: Get an invoice with line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetail"

  /invoices/{id}/pdf:
    get:
      operationId: downloadInvoicePdf
      tags: [payments]
      summary: Download an invoice as a PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /smtp:
    get:
      operationId: getSmtpSettings
      tags: [smtp]
      summary: Get active SMTP settings (admin)
      responses:
        "200":
          description: SMTP settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"
    post:
      operationId: createSmtpSettings
      tags: [smtp]
      summary: Create SMTP configuration (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmtpSettingsInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"

  /smtp/all:
    get:
      operationId: listSmtpSettings
      tags: [smtp]
      summary: List all SMTP configurations (admin)
      responses:
        "200":
          description: SMTP configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmtpSettings"

  /smtp/test:
    post:
      operationId: testSmtp
      tags: [smtp]
      summary: Test active SMTP configuration (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string

  /smtp/{id}:
    patch:
      operationId: updateSmtpSettings
      tags: [smtp]
      summary: Update SMTP configuration (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmtpSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"
    delete:
      operationId: deleteSmtpSettings
      tags: [smtp]
      summary: Delete SMTP configuration (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: List current user's API keys
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Create a new API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                expiresInDays:
