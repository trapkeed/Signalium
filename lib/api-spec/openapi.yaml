openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Signalium API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: plans
    description: Subscription plan operations
  - name: subscriptions
    description: Customer subscription operations
  - name: eas
    description: Expert Advisor operations
  - name: runtime
    description: Runtime and telemetry operations
  - name: users
    description: User management operations
  - name: stats
    description: Platform statistics operations
  - name: payments
    description: Payment and provider operations
  - name: smtp
    description: SMTP configuration operations
  - name: api-keys
    description: API key management operations
  - name: ea-registrations
    description: EA terminal registration operations
  - name: ea-builds
    description: Per-user EA build generation, download, and audit operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List subscription plans
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create a subscription plan (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /plans/{id}:
    get:
      operationId: getPlan
      tags: [plans]
      summary: Get a plan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "404":
          description: Not found
    patch:
      operationId: updatePlan
      tags: [plans]
      summary: Update a plan (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdate"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: deletePlan
      tags: [plans]
      summary: Delete a plan (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List subscriptions
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/me:
    get:
      operationId: getMySubscription
      tags: [subscriptions]
      summary: Get the current user's subscription
      responses:
        "200":
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: No active subscription

  /subscriptions/{id}:
    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    delete:
      operationId: cancelSubscription
      tags: [subscriptions]
      summary: Cancel a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /eas:
    get:
      operationId: listEas
      tags: [eas]
      summary: List Expert Advisors
      responses:
        "200":
          description: List of EAs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ea"
    post:
      operationId: createEa
      tags: [eas]
      summary: Create an EA (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaInput"
      responses:
        "201":
          description: Created EA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ea"

  /eas/{id}:
    get:
      operationId: getEa
      tags: [eas]
      summary: Get an EA by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: EA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ea"
        "404":
          description: Not found
    patch:
      operationId: updateEa
      tags: [eas]
      summary: Update an EA (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaUpdate"
      responses:
        "200":
          description: Updated EA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ea"
    delete:
      operationId: deleteEa
      tags: [eas]
      summary: Delete an EA (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /eas/{id}/download-token:
    post:
      operationId: getEaDownloadToken
      tags: [eas]
      summary: Generate a download token for an EA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Download token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadToken"

  /runtime/status:
    get:
      operationId: getRuntimeStatus
      tags: [runtime]
      summary: Get runtime status for current user
      responses:
        "200":
          description: Runtime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeStatus"

  /runtime/telemetry:
    get:
      operationId: listTelemetry
      tags: [runtime]
      summary: List recent telemetry events
      responses:
        "200":
          description: Telemetry events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelemetryEvent"
    post:
      operationId: recordTelemetry
      tags: [runtime]
      summary: Record a telemetry event (from EA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryEvent"

  /runtime/heartbeat:
    post:
      operationId: recordHeartbeat
      tags: [runtime]
      summary: Record EA heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatInput"
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /payments/providers:
    get:
      operationId: listPaymentProviders
      tags: [payments]
      summary: List payment providers
      responses:
        "200":
          description: List of payment providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentProvider"
    post:
      operationId: createPaymentProvider
      tags: [payments]
      summary: Create a payment provider (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProviderInput"
      responses:
        "201":
          description: Created provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentProvider"

  /payments/providers/{id}:
    get:
      operationId: getPaymentProvider
      tags: [payments]
      summary: Get a payment provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentProvider"
    patch:
      operationId: updatePaymentProvider
      tags: [payments]
      summary: Update a payment provider (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProviderUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentProvider"
    delete:
      operationId: deletePaymentProvider
      tags: [payments]
      summary: Delete a payment provider (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /payments:
    get:
      operationId: listMyPayments
      tags: [payments]
      summary: List current user's payments
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /payments/all:
    get:
      operationId: listAllPayments
      tags: [payments]
      summary: List all payments (admin)
      responses:
        "200":
          description: All payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /payments/intent:
    post:
      operationId: createPaymentIntent
      tags: [payments]
      summary: Create a payment intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentInput"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResult"

  /payments/{id}/submit:
    post:
      operationId: submitPaymentProof
      tags: [payments]
      summary: Submit transaction hash / proof
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProofInput"
      responses:
        "200":
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}/confirm:
    post:
      operationId: confirmPayment
      tags: [payments]
      summary: Confirm payment and activate subscription (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}/reject:
    post:
      operationId: rejectPayment
      tags: [payments]
      summary: Reject a payment (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        "200":
          description: Payment rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /smtp:
    get:
      operationId: getSmtpSettings
      tags: [smtp]
      summary: Get active SMTP settings (admin)
      responses:
        "200":
          description: SMTP settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"
    post:
      operationId: createSmtpSettings
      tags: [smtp]
      summary: Create SMTP configuration (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmtpSettingsInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"

  /smtp/all:
    get:
      operationId: listSmtpSettings
      tags: [smtp]
      summary: List all SMTP configurations (admin)
      responses:
        "200":
          description: SMTP configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmtpSettings"

  /smtp/test:
    post:
      operationId: testSmtp
      tags: [smtp]
      summary: Test active SMTP configuration (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string

  /smtp/{id}:
    patch:
      operationId: updateSmtpSettings
      tags: [smtp]
      summary: Update SMTP configuration (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmtpSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"
    delete:
      operationId: deleteSmtpSettings
      tags: [smtp]
      summary: Delete SMTP configuration (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: List current user's API keys
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Create a new API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                expiresInDays:
                  type: integer
      responses:
        "201":
          description: API key created (full key shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"

  /api-keys/all:
    get:
      operationId: listAllApiKeys
      tags: [api-keys]
      summary: List all API keys across all users (admin)
      responses:
        "200":
          description: API keys with usage counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"

  /api-keys/security-report:
    get:
      operationId: getApiKeySecurityReport
      tags: [api-keys]
      summary: Security report — status breakdown, expiring/stale keys, multi-hardware anomalies (admin)
      responses:
        "200":
          description: Security report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityReport"

  /api-keys/{id}/revoke:
    post:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke an API key (owner or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"

  /api-keys/{id}/rotate:
    post:
      operationId: rotateApiKey
      tags: [api-keys]
      summary: Rotate an API key's secret, keeping its id and registrations (owner or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rotated (full new key shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"

  /api-keys/{id}/suspend:
    post:
      operationId: suspendApiKey
      tags: [api-keys]
      summary: Suspend a suspected-compromised key without permanently revoking it (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"

  /api-keys/{id}/reactivate:
    post:
      operationId: reactivateApiKey
      tags: [api-keys]
      summary: Reactivate a suspended key (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"

  /api-keys/{id}/registrations:
    get:
      operationId: listApiKeyRegistrations
      tags: [api-keys]
      summary: List EA terminal registrations for a key (owner or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: EA registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EaRegistration"

  /api-keys/verify:
    post:
      operationId: verifyApiKey
      tags: [api-keys]
      summary: Verify an API key (used by EA runtime)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
      responses:
        "200":
          description: Valid key
          content:
            application/json:
              schema:
                type: object
                required: [ok, userId]
                properties:
                  ok:
                    type: boolean
                  userId:
                    type: string
                  keyId:
                    type: integer
                  status:
                    $ref: "#/components/schemas/ApiKeyStatus"

  /ea-registrations:
    get:
      operationId: listMyEaRegistrations
      tags: [ea-registrations]
      summary: List the current user's EA terminal registrations (across all their API keys)
      responses:
        "200":
          description: EA registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EaRegistration"
    post:
      operationId: registerEaTerminal
      tags: [ea-registrations]
      summary: Register (or refresh) an EA terminal — called by the EA on startup using its API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hardwareId]
              properties:
                apiKey:
                  type: string
                hardwareId:
                  type: string
                mt5Account:
                  type: string
                brokerName:
                  type: string
                brokerServer:
                  type: string
                terminalBuild:
                  type: string
                platformVersion:
                  type: string
      responses:
        "201":
          description: Registration created or refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaRegistration"

  /ea-registrations/{id}/deactivate:
    patch:
      operationId: deactivateEaRegistration
      tags: [ea-registrations]
      summary: Deactivate a specific EA terminal (hardware replacement, decommission) — owner or admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaRegistration"

  /ea-builds/generate:
    post:
      operationId: generateEaBuild
      tags: [ea-builds]
      summary: Generate a new unique EA build for the current user (requires active subscription + active API key)
      responses:
        "201":
          description: Build generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaBuild"

  /ea-builds:
    get:
      operationId: listMyEaBuilds
      tags: [ea-builds]
      summary: List the current user's EA builds
      responses:
        "200":
          description: EA builds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EaBuild"

  /ea-builds/admin/all:
    get:
      operationId: listAllEaBuilds
      tags: [ea-builds]
      summary: List all EA builds across all users (admin)
      responses:
        "200":
          description: EA builds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EaBuild"

  /ea-builds/admin/audit:
    get:
      operationId: getGlobalEaBuildAuditLog
      tags: [ea-builds]
      summary: Global EA build audit log across all users (admin)
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EaBuildAuditEntry"

  /ea-builds/{buildId}/download:
    get:
      operationId: downloadEaBuild
      tags: [ea-builds]
      summary: Download a build's compiled .ex5 file (owner or admin)
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: EA binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /ea-builds/{buildId}/regenerate:
    post:
      operationId: regenerateEaBuild
      tags: [ea-builds]
      summary: Regenerate a build with refreshed metadata, superseding the previous one (owner or admin)
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: New build generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaBuild"

  /ea-builds/{buildId}/revoke:
    post:
      operationId: revokeEaBuild
      tags: [ea-builds]
      summary: Revoke a build, e.g. on suspected leak or compromise (owner or admin)
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaBuild"

  /ea-builds/{buildId}/audit:
    get:
      operationId: getEaBuildAudit
      tags: [ea-builds]
      summary: Audit trail for a specific build (owner or admin)
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EaBuildAuditEntry"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [stats]
      summary: Get platform overview stats (admin)
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /stats/runtime-summary:
    get:
      operationId: getRuntimeSummary
      tags: [stats]
      summary: Get runtime activity summary for current user
      responses:
        "200":
          description: Runtime summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Plan:
      type: object
      required: [id, name, priceMonthly, features, isActive, tier, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: ["integer", "null"]
        createdAt:
          type: string

    PlanInput:
      type: object
      required: [name, priceMonthly, tier]
      properties:
        name:
          type: string
        description:
          type: string
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: integer
        isActive:
          type: boolean

    PlanUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: integer
        isActive:
          type: boolean

    Subscription:
      type: object
      required: [id, userId, planId, status, startedAt, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        planId:
          type: integer
        plan:
          $ref: "#/components/schemas/Plan"
        status:
          type: string
          enum: [active, cancelled, past_due, trialing]
        startedAt:
          type: string
        endsAt:
          type: ["string", "null"]
        createdAt:
          type: string
        userEmail:
          type: ["string", "null"]

    SubscriptionInput:
      type: object
      required: [planId]
      properties:
        planId:
          type: integer
        userId:
          type: string

    SubscriptionUpdate:
      type: object
      properties:
        planId:
          type: integer
        status:
          type: string
          enum: [active, cancelled, past_due, trialing]
        endsAt:
          type: string

    Ea:
      type: object
      required: [id, name, version, isActive, requiredTier, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        version:
          type: string
        platform:
          type: string
          enum: [mt4, mt5, both]
        requiredTier:
          type: string
          enum: [starter, professional, enterprise]
        isActive:
          type: boolean
        downloadCount:
          type: integer
        changeLog:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    EaInput:
      type: object
      required: [name, version, requiredTier, platform]
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        platform:
          type: string
          enum: [mt4, mt5, both]
        requiredTier:
          type: string
          enum: [starter, professional, enterprise]
        isActive:
          type: boolean
        changeLog:
          type: string

    EaUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        platform:
          type: string
          enum: [mt4, mt5, both]
        requiredTier:
          type: string
          enum: [starter, professional, enterprise]
        isActive:
          type: boolean
        changeLog:
          type: string

    DownloadToken:
      type: object
      required: [token, expiresAt, eaId]
      properties:
        token:
          type: string
        expiresAt:
          type: string
        eaId:
          type: integer

    RuntimeStatus:
      type: object
      required: [isConnected, lastHeartbeat, activeEas]
      properties:
        isConnected:
          type: boolean
        lastHeartbeat:
          type: ["string", "null"]
        activeEas:
          type: integer
        accountId:
          type: ["string", "null"]
        broker:
          type: ["string", "null"]

    TelemetryEvent:
      type: object
      required: [id, userId, eventType, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        eaId:
          type: ["integer", "null"]
        eventType:
          type: string
          enum: [trade_open, trade_close, error, info, heartbeat, startup, shutdown]
        payload:
          type: ["string", "null"]
        createdAt:
          type: string

    TelemetryInput:
      type: object
      required: [eventType]
      properties:
        eaId:
          type: integer
        eventType:
          type: string
          enum: [trade_open, trade_close, error, info, heartbeat, startup, shutdown]
        payload:
          type: string

    HeartbeatInput:
      type: object
      required: [eaId]
      properties:
        eaId:
          type: integer
        accountId:
          type: string
        broker:
          type: string
        activePositions:
          type: integer

    HeartbeatResponse:
      type: object
      required: [ok, timestamp]
      properties:
        ok:
          type: boolean
        timestamp:
          type: string

    User:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: string
          enum: [user, admin]
        isActive:
          type: boolean
        subscriptionStatus:
          type: ["string", "null"]
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [user, admin]
        isActive:
          type: boolean

    StatsOverview:
      type: object
      required: [totalUsers, activeSubscriptions, totalEas, totalTelemetryEvents, revenueMonthly]
      properties:
        totalUsers:
          type: integer
        activeSubscriptions:
          type: integer
        totalEas:
          type: integer
        totalTelemetryEvents:
          type: integer
        revenueMonthly:
          type: number
        subscriptionsByTier:
          type: object
          additionalProperties:
            type: integer
        recentSignups:
          type: integer

    RuntimeSummary:
      type: object
      required: [totalEvents, tradesOpened, tradesClosed, errors, uptime]
      properties:
        totalEvents:
          type: integer
        tradesOpened:
          type: integer
        tradesClosed:
          type: integer
        errors:
          type: integer
        uptime:
          type: number
        lastActivity:
          type: ["string", "null"]

    PaymentProvider:
      type: object
      required: [id, type, name, isActive, config, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [usdt, card, bank_transfer]
        name:
          type: string
        isActive:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    PaymentProviderInput:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [usdt, card, bank_transfer]
        name:
          type: string
        isActive:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string

    PaymentProviderUpdate:
      type: object
      properties:
        name:
          type: string
        isActive:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string

    Payment:
      type: object
      required: [id, userId, providerId, amount, currency, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        subscriptionId:
          type: ["integer", "null"]
        providerId:
          type: integer
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, submitted, confirmed, failed, refunded]
        reference:
          type: ["string", "null"]
        txHash:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        confirmedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    PaymentIntentInput:
      type: object
      required: [planId, providerId]
      properties:
        planId:
          type: integer
        providerId:
          type: integer

    PaymentIntentResult:
      type: object
      required: [payment, provider]
      properties:
        payment:
          $ref: "#/components/schemas/Payment"
        provider:
          type: object
          properties:
            type:
              type: string
            name:
              type: string
            instructions:
              type: object
              additionalProperties:
                type: string

    PaymentProofInput:
      type: object
      properties:
        txHash:
          type: string
        notes:
          type: string

    SmtpSettings:
      type: object
      required: [id, host, port, username, fromEmail, fromName, useTls, isActive, createdAt]
      properties:
        id:
          type: integer
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        fromEmail:
          type: string
        fromName:
          type: string
        useTls:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    SmtpSettingsInput:
      type: object
      required: [host, username, password, fromEmail]
      properties:
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        fromEmail:
          type: string
        fromName:
          type: string
        useTls:
          type: boolean
        isActive:
          type: boolean

    SmtpSettingsUpdate:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        fromEmail:
          type: string
        fromName:
          type: string
        useTls:
          type: boolean
        isActive:
          type: boolean

    ApiKeyStatus:
      type: string
      enum: [active, revoked, expired, suspended]

    ApiKey:
      type: object
      required: [id, userId, name, keyPrefix, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        keyPrefix:
          type: string
        status:
          $ref: "#/components/schemas/ApiKeyStatus"
        expiresAt:
          type: ["string", "null"]
        lastUsedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        registrationCount:
          type: integer
          description: Only present on admin list endpoint

    ApiKeyCreated:
      type: object
      required: [id, userId, name, key, keyPrefix, status, createdAt, warning]
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        key:
          type: string
        keyPrefix:
          type: string
        status:
          $ref: "#/components/schemas/ApiKeyStatus"
        expiresAt:
          type: ["string", "null"]
        createdAt:
          type: string
        warning:
          type: string

    EaRegistration:
      type: object
      required: [id, apiKeyId, hardwareId, isActive, registeredAt, lastSeenAt]
      properties:
        id:
          type: integer
        apiKeyId:
          type: integer
        apiKeyName:
          type: string
          description: Only present on the user's own registrations listing
        hardwareId:
          type: string
        mt5Account:
          type: ["string", "null"]
        brokerName:
          type: ["string", "null"]
        brokerServer:
          type: ["string", "null"]
        terminalBuild:
          type: ["string", "null"]
        platformVersion:
          type: ["string", "null"]
        isActive:
          type: boolean
        registeredAt:
          type: string
        lastSeenAt:
          type: string

    SecurityReport:
      type: object
      required: [totalKeys, statusBreakdown, expiringSoon, staleActiveKeys, multiHardwareAnomalies]
      properties:
        totalKeys:
          type: integer
        statusBreakdown:
          type: object
          additionalProperties:
            type: integer
        expiringSoon:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              userId:
                type: string
              expiresAt:
                type: ["string", "null"]
        staleActiveKeys:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              userId:
                type: string
              lastUsedAt:
                type: ["string", "null"]
        multiHardwareAnomalies:
          type: array
          items:
            type: object
            properties:
              apiKeyId:
                type: integer
              distinctHardwareCount:
                type: integer

    EaBuildStatus:
      type: string
      enum: [active, revoked, superseded]

    EaBuildMetadata:
      type: object
      required: [userId, apiKeyHash, buildId, subscriptionTier, generationTimestamp, platformVersion]
      description: Embedded, non-secret build metadata. Never contains the raw API key.
      properties:
        userId:
          type: string
        apiKeyHash:
          type: string
        buildId:
          type: string
        subscriptionTier:
          type: string
        generationTimestamp:
          type: string
        platformVersion:
          type: string

    EaBuild:
      type: object
      required: [id, userId, apiKeyId, buildId, fileName, platform, platformVersion, subscriptionTier, status, metadata, checksum, fileSizeBytes, downloadCount, generatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        apiKeyId:
          type: integer
        buildId:
          type: string
        fileName:
          type: string
        platform:
          type: string
          enum: [mt5]
        platformVersion:
          type: string
        subscriptionTier:
          type: string
        status:
          $ref: "#/components/schemas/EaBuildStatus"
        metadata:
          $ref: "#/components/schemas/EaBuildMetadata"
        checksum:
          type: string
        fileSizeBytes:
          type: integer
        downloadCount:
          type: integer
        lastDownloadedAt:
          type: ["string", "null"]
        generatedAt:
          type: string
        revokedAt:
          type: ["string", "null"]

    EaBuildAuditEntry:
      type: object
      required: [id, buildId, userId, action, createdAt]
      properties:
        id:
          type: integer
        buildId:
          type: integer
        fileName:
          type: string
          description: Only present on the global admin audit listing
        buildIdentifier:
          type: string
          description: Only present on the global admin audit listing (the build's public buildId)
        userId:
          type: string
        action:
          type: string
          enum: [generated, downloaded, regenerated, revoked]
        detail:
          type: object
          additionalProperties: true
        createdAt:
          type: string
