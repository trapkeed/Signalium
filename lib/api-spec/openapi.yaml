openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Signalium API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: plans
    description: Subscription plan operations
  - name: subscriptions
    description: Customer subscription operations
  - name: eas
    description: Expert Advisor operations
  - name: runtime
    description: Runtime and telemetry operations
  - name: users
    description: User management operations
  - name: stats
    description: Platform statistics operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List subscription plans
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create a subscription plan (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /plans/{id}:
    get:
      operationId: getPlan
      tags: [plans]
      summary: Get a plan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "404":
          description: Not found
    patch:
      operationId: updatePlan
      tags: [plans]
      summary: Update a plan (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdate"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: deletePlan
      tags: [plans]
      summary: Delete a plan (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List subscriptions
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/me:
    get:
      operationId: getMySubscription
      tags: [subscriptions]
      summary: Get the current user's subscription
      responses:
        "200":
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: No active subscription

  /subscriptions/{id}:
    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    delete:
      operationId: cancelSubscription
      tags: [subscriptions]
      summary: Cancel a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /eas:
    get:
      operationId: listEas
      tags: [eas]
      summary: List Expert Advisors
      responses:
        "200":
          description: List of EAs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ea"
    post:
      operationId: createEa
      tags: [eas]
      summary: Create an EA (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaInput"
      responses:
        "201":
          description: Created EA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ea"

  /eas/{id}:
    get:
      operationId: getEa
      tags: [eas]
      summary: Get an EA by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: EA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ea"
        "404":
          description: Not found
    patch:
      operationId: updateEa
      tags: [eas]
      summary: Update an EA (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaUpdate"
      responses:
        "200":
          description: Updated EA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ea"
    delete:
      operationId: deleteEa
      tags: [eas]
      summary: Delete an EA (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /eas/{id}/download-token:
    post:
      operationId: getEaDownloadToken
      tags: [eas]
      summary: Generate a download token for an EA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Download token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadToken"

  /runtime/status:
    get:
      operationId: getRuntimeStatus
      tags: [runtime]
      summary: Get runtime status for current user
      responses:
        "200":
          description: Runtime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeStatus"

  /runtime/telemetry:
    get:
      operationId: listTelemetry
      tags: [runtime]
      summary: List recent telemetry events
      responses:
        "200":
          description: Telemetry events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelemetryEvent"
    post:
      operationId: recordTelemetry
      tags: [runtime]
      summary: Record a telemetry event (from EA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryEvent"

  /runtime/heartbeat:
    post:
      operationId: recordHeartbeat
      tags: [runtime]
      summary: Record EA heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatInput"
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [stats]
      summary: Get platform overview stats (admin)
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /stats/runtime-summary:
    get:
      operationId: getRuntimeSummary
      tags: [stats]
      summary: Get runtime activity summary for current user
      responses:
        "200":
          description: Runtime summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Plan:
      type: object
      required: [id, name, priceMonthly, features, isActive, tier, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: ["integer", "null"]
        createdAt:
          type: string

    PlanInput:
      type: object
      required: [name, priceMonthly, tier]
      properties:
        name:
          type: string
        description:
          type: string
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: integer
        isActive:
          type: boolean

    PlanUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: integer
        isActive:
          type: boolean

    Subscription:
      type: object
      required: [id, userId, planId, status, startedAt, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        planId:
          type: integer
        plan:
          $ref: "#/components/schemas/Plan"
        status:
          type: string
          enum: [active, cancelled, past_due, trialing]
        startedAt:
          type: string
        endsAt:
          type: ["string", "null"]
        createdAt:
          type: string
        userEmail:
          type: ["string", "null"]

    SubscriptionInput:
      type: object
      required: [planId]
      properties:
        planId:
          type: integer
        userId:
          type: string

    SubscriptionUpdate:
      type: object
      properties:
        planId:
          type: integer
        status:
          type: string
          enum: [active, cancelled, past_due, trialing]
        endsAt:
          type: string

    Ea:
      type: object
      required: [id, name, version, isActive, requiredTier, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        version:
          type: string
        platform:
          type: string
          enum: [mt4, mt5, both]
        requiredTier:
          type: string
          enum: [starter, professional, enterprise]
        isActive:
          type: boolean
        downloadCount:
          type: integer
        changeLog:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    EaInput:
      type: object
      required: [name, version, requiredTier, platform]
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        platform:
          type: string
          enum: [mt4, mt5, both]
        requiredTier:
          type: string
          enum: [starter, professional, enterprise]
        isActive:
          type: boolean
        changeLog:
          type: string

    EaUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        platform:
          type: string
          enum: [mt4, mt5, both]
        requiredTier:
          type: string
          enum: [starter, professional, enterprise]
        isActive:
          type: boolean
        changeLog:
          type: string

    DownloadToken:
      type: object
      required: [token, expiresAt, eaId]
      properties:
        token:
          type: string
        expiresAt:
          type: string
        eaId:
          type: integer

    RuntimeStatus:
      type: object
      required: [isConnected, lastHeartbeat, activeEas]
      properties:
        isConnected:
          type: boolean
        lastHeartbeat:
          type: ["string", "null"]
        activeEas:
          type: integer
        accountId:
          type: ["string", "null"]
        broker:
          type: ["string", "null"]

    TelemetryEvent:
      type: object
      required: [id, userId, eventType, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        eaId:
          type: ["integer", "null"]
        eventType:
          type: string
          enum: [trade_open, trade_close, error, info, heartbeat, startup, shutdown]
        payload:
          type: ["string", "null"]
        createdAt:
          type: string

    TelemetryInput:
      type: object
      required: [eventType]
      properties:
        eaId:
          type: integer
        eventType:
          type: string
          enum: [trade_open, trade_close, error, info, heartbeat, startup, shutdown]
        payload:
          type: string

    HeartbeatInput:
      type: object
      required: [eaId]
      properties:
        eaId:
          type: integer
        accountId:
          type: string
        broker:
          type: string
        activePositions:
          type: integer

    HeartbeatResponse:
      type: object
      required: [ok, timestamp]
      properties:
        ok:
          type: boolean
        timestamp:
          type: string

    User:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: string
          enum: [user, admin]
        isActive:
          type: boolean
        subscriptionStatus:
          type: ["string", "null"]
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [user, admin]
        isActive:
          type: boolean

    StatsOverview:
      type: object
      required: [totalUsers, activeSubscriptions, totalEas, totalTelemetryEvents, revenueMonthly]
      properties:
        totalUsers:
          type: integer
        activeSubscriptions:
          type: integer
        totalEas:
          type: integer
        totalTelemetryEvents:
          type: integer
        revenueMonthly:
          type: number
        subscriptionsByTier:
          type: object
          additionalProperties:
            type: integer
        recentSignups:
          type: integer

    RuntimeSummary:
      type: object
      required: [totalEvents, tradesOpened, tradesClosed, errors, uptime]
      properties:
        totalEvents:
          type: integer
        tradesOpened:
          type: integer
        tradesClosed:
          type: integer
        errors:
          type: integer
        uptime:
          type: number
        lastActivity:
          type: ["string", "null"]
