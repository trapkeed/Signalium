components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Plan:
      type: object
      required: [id, name, priceMonthly, features, isActive, tier, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: ["integer", "null"]
        maxSymbols:
          type: ["integer", "null"]
        autonomousAllowed:
          type: boolean
        apiAccessAllowed:
          type: boolean
        researchAccess:
          type: boolean
        promoPriceMonthly:
          type: ["number", "null"]
        promoLabel:
          type: ["string", "null"]
        regionalPricing:
          type: object
          additionalProperties:
            type: number
          nullable: true
        createdAt:
          type: string

    PlanInput:
      type: object
      required: [name, priceMonthly, tier]
      properties:
        name:
          type: string
        description:
          type: string
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: integer
        maxSymbols:
          type: integer
        autonomousAllowed:
          type: boolean
        apiAccessAllowed:
          type: boolean
        researchAccess:
          type: boolean
        isActive:
          type: boolean
        promoPriceMonthly:
          type: ["number", "null"]
        promoLabel:
          type: ["string", "null"]
        regionalPricing:
          type: object
          additionalProperties:
            type: number

    PlanUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
        tier:
          type: string
          enum: [starter, professional, enterprise]
        maxEas:
          type: integer
        maxSymbols:
          type: integer
        autonomousAllowed:
          type: boolean
        apiAccessAllowed:
          type: boolean
        researchAccess:
          type: boolean
        isActive:
          type: boolean
        promoPriceMonthly:
          type: ["number", "null"]
        promoLabel:
          type: ["string", "null"]
        regionalPricing:
          type: object
          additionalProperties:
            type: number

    Subscription:
      type: object
      required: [id, userId, planId, status, startedAt, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        planId:
          type: integer
        plan:
          $ref: "#/components/schemas/Plan"
        status:
          type: string
          enum: [pending_payment, active, grace_period, suspended, expired, cancelled, paused]
        startedAt:
          type: string
        currentPeriodEnd:
          type: ["string", "null"]
        graceEndsAt:
          type: ["string", "null"]
        cancelAtPeriodEnd:
          type: boolean
        pausedAt:
          type: ["string", "null"]
        cancelledAt:
          type: ["string", "null"]
        endsAt:
          type: ["string", "null"]
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
        userEmail:
          type: ["string", "null"]

    SubscriptionInput:
      type: object
      required: [planId]
      properties:
        planId:
          type: integer
        userId:
          type: string

    SubscriptionUpdate:
      type: object
      properties:
        planId:
          type: integer
        status:
          type: string
          enum: [pending_payment, active, grace_period, suspended, expired, cancelled, paused]
        cancelAtPeriodEnd:
          type: boolean
        endsAt:
          type: string

    SubscriptionEvent:
      type: object
      required: [id, subscriptionId, userId, eventType, createdAt]
      properties:
        id:
          type: integer
        subscriptionId:
          type: integer
        userId:
          type: string
        eventType:
          type: string
          enum:
            [
              SUBSCRIPTION_CREATED,
              SUBSCRIPTION_RENEWED,
              SUBSCRIPTION_UPGRADED,
              SUBSCRIPTION_DOWNGRADED,
              GRACE_STARTED,
              GRACE_ENDED,
              SUBSCRIPTION_EXPIRED,
              SUBSCRIPTION_CANCELLED,
              SUBSCRIPTION_PAUSED,
              SUBSCRIPTION_RESUMED,
              SUBSCRIPTION_SUSPENDED,
              SUBSCRIPTION_REACTIVATED,
              ADMIN_OVERRIDE,
              PAYMENT_CONFIRMED,
              PAYMENT_FAILED,
              PAYMENT_REFUNDED,
              INVOICE_ISSUED,
              SUBSCRIPTION_EXTENDED,
              PROMOTIONAL_CREDIT_GRANTED,
            ]
        fromStatus:
          type: ["string", "null"]
        toStatus:
          type: ["string", "null"]
        detail:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string

    EntitlementSummary:
      type: object
      required:
        [
          status,
          manualAllowed,
          autonomousAllowed,
          eaGenerationAllowed,
          apiAccessAllowed,
          researchAccess,
          maxSymbols,
          maxActiveEas,
        ]
      properties:
        status:
          type: string
          enum: [pending_payment, active, grace_period, suspended, expired, cancelled, paused, none]
        manualAllowed:
          type: boolean
        autonomousAllowed:
          type: boolean
        eaGenerationAllowed:
          type: boolean
        apiAccessAllowed:
          type: boolean
        researchAccess:
          type: boolean
        maxSymbols:
          type: ["integer", "null"]
        maxActiveEas:
          type: ["integer", "null"]
        graceEndsAt:
          type: ["string", "null"]
        planName:
          type: ["string", "null"]

    Ea:
      type: object
      required: [id, name, version, isActive, requiredTier, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        version:
          type: string
        platform:
          type: string
          enum: [mt4, mt5, both]
        requiredTier:
          type: string
          enum: [starter, professional, enterprise]
        isActive:
          type: boolean
        downloadCount:
          type: integer
        changeLog:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    EaInput:
      type: object
      required: [name, version, requiredTier, platform]
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        platform:
          type: string
          enum: [mt4, mt5, both]
        requiredTier:
          type: string
          enum: [starter, professional, enterprise]
        isActive:
          type: boolean
        changeLog:
          type: string

    EaUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        platform:
          type: string
          enum: [mt4, mt5, both]
        requiredTier:
          type: string
          enum: [starter, professional, enterprise]
        isActive:
          type: boolean
        changeLog:
          type: string

    DownloadToken:
      type: object
      required: [token, expiresAt, eaId]
      properties:
        token:
          type: string
        expiresAt:
          type: string
        eaId:
          type: integer

    RuntimeStatus:
      type: object
      required: [isConnected, lastHeartbeat, activeEas]
      properties:
        isConnected:
          type: boolean
        lastHeartbeat:
          type: ["string", "null"]
        activeEas:
          type: integer
        accountId:
          type: ["string", "null"]
        broker:
          type: ["string", "null"]

    TelemetryEvent:
      type: object
      required: [id, userId, eventType, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        eaId:
          type: ["integer", "null"]
        eventType:
          type: string
          enum: [trade_open, trade_close, error, info, heartbeat, startup, shutdown]
        payload:
          type: ["string", "null"]
        createdAt:
          type: string

    TelemetryInput:
      type: object
      required: [eventType]
      properties:
        eaId:
          type: integer
        eventType:
          type: string
          enum: [trade_open, trade_close, error, info, heartbeat, startup, shutdown]
        payload:
          type: string

    HeartbeatInput:
      type: object
      required: [eaId]
      properties:
        eaId:
          type: integer
        accountId:
          type: string
        broker:
          type: string
        activePositions:
          type: integer

    HeartbeatResponse:
      type: object
      required: [ok, timestamp]
      properties:
        ok:
          type: boolean
        timestamp:
          type: string

    User:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: string
          enum: [user, admin]
        isActive:
          type: boolean
        subscriptionStatus:
          type: ["string", "null"]
        preferredPaymentProviderId:
          type: ["integer", "null"]
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [user, admin]
        isActive:
          type: boolean

    UpdateMeBody:
      type: object
      description: Self-service profile fields a user may update on their own account.
      properties:
        firstName:
          type: string
        lastName:
          type: string
        preferredPaymentProviderId:
          type: ["integer", "null"]

    StatsOverview:
      type: object
      required: [totalUsers, activeSubscriptions, totalEas, totalTelemetryEvents, revenueMonthly]
      properties:
        totalUsers:
          type: integer
        activeSubscriptions:
          type: integer
        totalEas:
          type: integer
        totalTelemetryEvents:
          type: integer
        revenueMonthly:
          type: number
        subscriptionsByTier:
          type: object
          additionalProperties:
            type: integer
        recentSignups:
          type: integer

    RuntimeSummary:
      type: object
      required: [totalEvents, tradesOpened, tradesClosed, errors, uptime]
      properties:
        totalEvents:
          type: integer
        tradesOpened:
          type: integer
        tradesClosed:
          type: integer
        errors:
          type: integer
        uptime:
          type: number
        lastActivity:
          type: ["string", "null"]

    PaymentProviderType:
      type: string
      enum: [usdt_trc20, usdt_erc20, usdt_bep20, stripe, paypal, flutterwave]

    PaymentProviderPublic:
      type: object
      required: [id, type, name, isActive, connectable, createdAt]
      description: Safe, non-admin view of a payment provider — never includes `config` (which may hold secrets/credentials).
      properties:
        id:
          type: integer
        type:
          $ref: "#/components/schemas/PaymentProviderType"
        name:
          type: string
        isActive:
          type: boolean
        connectable:
          type: boolean
          description: Whether the provider currently has the credentials/config needed to actually process a payment.
        limitation:
          type: ["string", "null"]
          description: Human-readable explanation when the provider is not connectable.
        createdAt:
          type: string
        updatedAt:
          type: string

    PaymentProvider:
      type: object
      required: [id, type, name, isActive, config, createdAt]
      description: Full admin view of a payment provider, including `config` (may hold secrets) — only ever returned to admins.
      properties:
        id:
          type: integer
        type:
          $ref: "#/components/schemas/PaymentProviderType"
        name:
          type: string
        isActive:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string
        connectable:
          type: boolean
          description: Whether the provider currently has the credentials/config needed to actually process a payment.
        limitation:
          type: ["string", "null"]
          description: Human-readable explanation when the provider is not connectable.
        createdAt:
          type: string
        updatedAt:
          type: string

    PaymentProviderInput:
      type: object
      required: [type, name]
      properties:
        type:
          $ref: "#/components/schemas/PaymentProviderType"
        name:
          type: string
        isActive:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string

    PaymentProviderUpdate:
      type: object
      properties:
        name:
          type: string
        isActive:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string

    Payment:
      type: object
      required: [id, userId, providerId, amount, currency, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        subscriptionId:
          type: ["integer", "null"]
        planId:
          type: ["integer", "null"]
        providerId:
          type: integer
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, confirming, confirmed, failed, expired, refunded]
        reference:
          type: ["string", "null"]
        network:
          type: ["string", "null"]
          enum: [trc20, erc20, bep20, null]
        walletAddress:
          type: ["string", "null"]
        txHash:
          type: ["string", "null"]
        confirmations:
          type: integer
        requiredConfirmations:
          type: ["integer", "null"]
        externalReference:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
        confirmedAt:
          type: ["string", "null"]
        refundedAt:
          type: ["string", "null"]
        refundNotes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    PaymentIntentInput:
      type: object
      required: [planId, providerId]
      properties:
        planId:
          type: integer
        providerId:
          type: integer
        region:
          type: string

    PaymentIntentResult:
      type: object
      required: [payment, provider]
      properties:
        payment:
          $ref: "#/components/schemas/Payment"
        provider:
          type: object
          properties:
            type:
              type: string
            name:
              type: string
            instructions:
              type: object
              additionalProperties: true

    PaymentProofInput:
      type: object
      required: [txHash]
      properties:
        txHash:
          type: string
        notes:
          type: string

    PaymentConfirmationsInput:
      type: object
      required: [confirmations]
      properties:
        confirmations:
          type: integer

    RefundPaymentBody:
      type: object
      properties:
        notes:
          type: string

    ExtendSubscriptionBody:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
        notes:
          type: string

    GrantCreditBody:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
        reason:
          type: string

    Invoice:
